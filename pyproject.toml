[project]
name = "django-saas-starter"
version = "0.1.0"
description = "A production-minded, open-source Django SaaS starter: accounts, plans, optional Stripe billing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andrew Rico" }]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF012", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S603", "E501"]
"scripts/*" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["migrations", "tests", ".venv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]
addopts = "-ra --cov=apps --cov-report=term-missing --cov-fail-under=90"
env = [
  "DJANGO_READ_DOT_ENV_FILE=false",
  "DEBUG=true",
  "SECRET_KEY=test-secret-key-not-for-production",
  "BILLING_ENABLED=false",
  "STRIPE_SECRET_KEY=",
  "STRIPE_WEBHOOK_SECRET=",
  "ACCOUNT_EMAIL_VERIFICATION=optional",
  "THROTTLE_AUTH=1000/min",
  "THROTTLE_ANON=100000/min",
  "THROTTLE_USER=100000/min",
  "D:DATABASE_URL=sqlite:///:memory:",
]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]
