name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy apps config scripts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saas
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas -d saas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://saas:saas@localhost:5432/saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "true"
          SECRET_KEY: ci-only
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "false"
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789-abcdefghijklmnop
          ALLOWED_HOSTS: example.com
          TRUST_PROXY_SSL_HEADER: "true"
      - name: Tests (coverage gate 90%)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: django-saas-starter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
