{% extends "base.html" %}
{% block head_title %}Account &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Account settings</h1>
  <dl>
    <dt>Email</dt><dd>{{ user.email }}</dd>
    <dt>Plan</dt><dd>{{ plan.name }}</dd>
  </dl>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form.html" %}
    <button type="submit" class="button">Save</button>
  </form>
  <p class="help"><a href="{% url 'account_change_password' %}">Change password</a></p>
  <hr>
  <h2>Danger zone</h2>
  <p><a class="button danger" href="{% url 'account-delete' %}">Delete account</a></p>
</section>
{% endblock %}
